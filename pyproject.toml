[tool.poetry]
name = "insteboe-analyser"
version = "0.1.0"
description = "Analysene bak tekstene på insteboe.org, bygget på åpne data fra SSB."
authors = ["Daniel Instebø"]
license = "MIT"
readme = "README.md"
packages = [{ include = "insteboe_analyser", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11"

[tool.poetry.group.dev.dependencies]
pytest = ">=8"

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
